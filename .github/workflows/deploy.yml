name: Deploy

# Despliegue automatizado del HIS cuando se hace push a `main`.
#
# Pipeline:
#   1. Tests        -> PHPUnit sobre PHP 8.3.
#   2. Build        -> construye la imagen inmutable (APP_VERSION / APP_COMMIT_SHA / APP_BUILD_TIME)
#                      y la publica en GitHub Container Registry (ghcr.io).
#   3. Deploy       -> ejecuta el laboratorio Blue-Green con los scripts de `deploy/bin`
#                      (deploy-color + switch-color) y valida el contrato público.
#
# Nota sobre el destino de despliegue:
#   Esta demo no tiene un servidor de producción fijo, por lo que el job `deploy` levanta
#   el laboratorio Blue-Green en el propio runner y ejecuta el ciclo completo
#   deploy -> switch -> verificación. Para desplegar a un host real, sustituir el job
#   `deploy` por un paso SSH (ej. `appleboy/ssh-action`) que ejecute los mismos scripts
#   en el host de producción; el artefacto publicado en GHCR es el mismo.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  PHP_VERSION: "8.3"

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run tests
        run: composer test

  build:
    name: Build & publish image
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derive release metadata
        id: meta
        shell: bash
        run: |
          repo_lower=$(printf '%s' "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          sha=$(git rev-parse --short=12 HEAD)
          build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "image=${REGISTRY}/${repo_lower}" >> "$GITHUB_OUTPUT"
          echo "tag=${sha}" >> "$GITHUB_OUTPUT"
          echo "version=${sha}" >> "$GITHUB_OUTPUT"
          echo "build_time=${build_time}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            APP_COMMIT_SHA=${{ steps.meta.outputs.tag }}
            APP_BUILD_TIME=${{ steps.meta.outputs.build_time }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest

  deploy:
    name: Blue-Green deploy
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare deploy state
        shell: bash
        run: |
          image="${{ needs.build.outputs.image }}:${{ needs.build.outputs.tag }}"
          mkdir -p deploy/runtime
          printf 'BLUE_IMAGE=%s\nGREEN_IMAGE=%s\n' "$image" "$image" > deploy/runtime/state.env
          docker pull "$image"

      - name: Start lab
        shell: bash
        run: docker compose --env-file deploy/runtime/state.env up -d --build

      - name: Deploy to inactive slot
        shell: bash
        run: deploy/bin/deploy-color green "${{ needs.build.outputs.image }}:${{ needs.build.outputs.tag }}"

      - name: Switch traffic to Green
        shell: bash
        run: |
          deploy/bin/switch-color green
          deploy/bin/current-color

      - name: Verify public contract
        shell: bash
        run: tests/Contract/container-smoke.sh http://127.0.0.1:8080 "${{ needs.build.outputs.version }}"
