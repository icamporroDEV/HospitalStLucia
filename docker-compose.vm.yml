# Use only with a rootless Docker daemon owned by the SSH user.
# /run/user/<uid>/docker.sock must be the rootless socket, not /var/run/docker.sock.
services:
  jenkins:
    build:
      context: .
      dockerfile: jenkins/Dockerfile
    image: hospital-jenkins:vm
    # Container root maps to the unprivileged owner of the rootless daemon.
    user: "0:0"
    environment:
      COMPOSE_PROJECT_NAME: hospital
      DOCKER_HOST: unix:///run/docker.sock
      HIS_STATE_FILE: /hospital-state/state.env
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - jenkins-home:/var/jenkins_home
      - ./deploy/runtime:/hospital-state
      - ${XDG_RUNTIME_DIR:?Set XDG_RUNTIME_DIR to the rootless user's runtime directory}/docker.sock:/run/docker.sock
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    networks:
      - his-internal

volumes:
  jenkins-home:
